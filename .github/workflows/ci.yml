name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sr-route-helper
          path: target/release/sr-route-helper

  netns:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sr-route-helper
          path: bin
      - run: chmod +x bin/sr-route-helper
      # Runs in a throwaway network namespace; the runner's own network is untouched.
      - run: sudo test/netns-test.sh "$PWD/bin/sr-route-helper"
