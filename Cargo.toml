[package]
name = "sr-route-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Routes and DNS for Session Router exits on Linux, with crash-safe undo"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
libc = "0.2.191"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.34.0"
netlink-sys = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
strip = true
lto = true
